name: CI pruebas

on:
  push:
    branches: [master]

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME }}/api-cine:${{ github.sha }}

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: instalar-node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: instalar-dependenciar
        run: npm ci

      - name: ejecutar-pruebas
        run: npm test

  docker:
    needs: pruebas
    runs-on: ubuntu-latest
    
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: docker-build
        uses: docker build -f ./Dockerfile -t $IMAGEN .
